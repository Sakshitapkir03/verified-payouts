services:
  - type: web
    name: verified-payouts
    runtime: node
    # Without a plan, Render defaults new web services to a paid instance.
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations run before the server starts. preDeployCommand would be
    # cleaner but is paid-only. If a migration fails, the new instance never
    # passes its health check and the previous deploy stays live.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      # Secrets and deployment-specific values: set in the Render dashboard.
      # sync: false keeps them out of this file.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
